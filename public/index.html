<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chirp</title><link rel="stylesheet" href="style.css"></head><body><nav><a class="brand" href="#">🐦 Chirp</a><div id="nav-user"></div><button id="logout" class="ghost hidden">Log out</button></nav><main><section id="auth" class="auth card"><h1>Welcome to Chirp</h1><p class="muted">A small, friendly place to share your thoughts.</p><div class="tabs"><button class="tab active" data-mode="login">Log in</button><button class="tab" data-mode="register">Register</button></div><form id="auth-form"><input name="username" placeholder="Username" required><input name="display_name" class="register-only hidden" placeholder="Display name"><input name="password" type="password" placeholder="Password" required minlength="6"><button>Continue</button></form></section><section id="app" class="hidden"><div class="layout"><aside class="card side"><div id="profile-mini"></div><nav class="side-nav"><button class="active" data-view="home">🏠 Home</button><button data-view="explore">🌎 Explore</button></nav></aside><section class="content"><div class="feed-head"><h1 id="feed-title">Home</h1><button id="refresh" class="ghost">↻</button></div><form id="post-form" class="card composer"><textarea name="content" maxlength="280" placeholder="What’s happening?" required></textarea><div><span id="counter">0 / 280</span><button>Chirp</button></div></form><div id="feed"></div></section></div></section></main><div id="modal" class="modal hidden"></div><div id="toast"></div><script src="app.js"></script></body></html>
